# ============================================================================
# coturn 配置
#
# 注意：coturn 的配置文件**不会**展开 ${VAR} 这类环境变量。
# 所以 realm / external-ip / static-auth-secret / 中继端口范围
# 全部由 docker-compose 通过命令行参数传入，这里只放与部署无关的通用设置。
# ============================================================================

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# TLS 证书（turns: 协议需要）。
# 证书不存在时 coturn 依然能启动，只是会禁用 TLS/DTLS 监听（日志里会有 WARNING），
# 此时只有 turn:（UDP/TCP 3478）可用。证书放置方式见 ./certs/README.md
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# HMAC-SHA1 动态凭证：与 monopoly 服务端的 TURN_SECRET 必须一致，
# 实际值通过命令行 --static-auth-secret 传入
use-auth-secret

# 性能 / 兼容
fingerprint
no-multicast-peers

# Prometheus 指标导出（Admin 面板「TURN 监控」会去抓这个端口）
prometheus
prometheus-port=9641

# 日志：输出到 stdout，交给 docker / dokploy 收集
log-file=stdout
# 排查连接问题时再打开，平时会刷很多日志
# verbose

# ---------------------------------------------------------------------------
# 可选：限制 TURN 中继的目标网段（默认允许所有，容易被打成开放中继）
# 单机自用可以打开下面两行，只允许中继到公网地址，禁止中继到内网/本机
# ---------------------------------------------------------------------------
# denied-peer-ip=0.0.0.0-0.255.255.255
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=127.0.0.0-127.255.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255
