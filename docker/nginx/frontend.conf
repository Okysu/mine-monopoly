# 自建服务器上托管「网页版客户端」静态产物用的 nginx 配置
#
# 配合 docker-compose 里的 web 服务使用：
#   ./web          -> /usr/share/nginx/html      （apps/client/dist/frontend 的内容）
#   ./nginx.conf   -> /etc/nginx/conf.d/default.conf
#
# 前端产物必须用 VITE_WEB_BASE_PATH=/ 构建（挂在域名/IP 根路径下）。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 构建产物已经带了 gzip 副本（vite-plugin-compression），这里再兜一层给动态响应
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml model/gltf-binary;

    # 带内容 hash 的资源可以永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3D 模型 / 贴图 / draco 解码器
    location ~* \.(glb|gltf|png|jpe?g|webp|gif|ico|svg|woff2?|ttf|mp3|ogg|wav)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 入口文件绝不缓存，否则发版后客户端会一直加载旧版本
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 用的是 history 路由（createWebHistory），刷新 /game、/room 这类
    # 深链接必须回退到 index.html，否则 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
