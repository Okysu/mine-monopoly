name: Build Android APK

# 只构建安卓 APK，产出 GitHub Actions 可下载的 artifact。
# 不依赖 R2 / webhook —— 签名的 keystore 是可选的（缺了会退回 debug 签名，
# 但那样每次构建签名都不同，装新版必须先卸载，而游戏存档存在本地会一起丢）。
#
# 服务器地址在构建时写死进 bundle，取自仓库 Variables：
#   MONOPOLY_DOMAIN / PROTOCOL / SERVER_PORT / ICE_SERVER_PORT /
#   MONOPOLY_ADMIN_PORT
# 以及仓库 Secrets：
#   MAP_ENCRYPT_KEY（必须和服务器端一致）
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD（建议配置，保证签名稳定）

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '覆盖 APK 版本号（留空则用 apps/client/package.json 的版本）'
        required: false
        type: string

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 客户端 vite.config.ts 直接 import "@mine-monopoly/env/vite-plugin"，
      # 该子路径指向 packages/env/dist/，不先构建就解析不到
      - name: 构建 @mine-monopoly/env
        run: pnpm --filter @mine-monopoly/env run build

      - name: （可选）覆盖版本号
        if: inputs.version_name != ''
        run: |
          sed -i 's/"version": "[^"]*"/"version": "${{ inputs.version_name }}"/' apps/client/package.json
          node -p "'版本号 -> ' + require('./apps/client/package.json').version"

      - name: 生成 .env（服务器地址在这里写死进 APK）
        env:
          # 默认值直接硬编码在 workflow 里（这是自建部署的固定地址）。
          # 如果仓库里配了同名 Variables，会覆盖下面的默认值。
          CFG_DOMAIN: ${{ vars.MONOPOLY_DOMAIN || 'rich-api.yby.zone' }}
          CFG_PROTOCOL: ${{ vars.PROTOCOL || 'https' }}
          CFG_API_PREFIX: ${{ vars.API_BASE_PREFIX || '/monopoly-server' }}
          CFG_ICE_PREFIX: ${{ vars.ICE_BASE_PREFIX || '/monopoly-ice' }}
          CFG_ADMIN_PREFIX: ${{ vars.ADMIN_BASE_PREFIX || '/monopoly-admin' }}
          CFG_SERVER_PORT: ${{ vars.SERVER_PORT || '8081' }}
          CFG_ICE_PORT: ${{ vars.ICE_SERVER_PORT || '8082' }}
          CFG_ADMIN_PORT: ${{ vars.MONOPOLY_ADMIN_PORT || '8083' }}
          CFG_MAP_KEY: ${{ secrets.MAP_ENCRYPT_KEY || 'e4979341983610c5' }}
        run: |
          set -euo pipefail
          cat > .env << EOF
          MONOPOLY_DOMAIN=${CFG_DOMAIN}
          PROTOCOL=${CFG_PROTOCOL}
          API_BASE_PREFIX=${CFG_API_PREFIX}
          ICE_BASE_PREFIX=${CFG_ICE_PREFIX}
          ADMIN_BASE_PREFIX=${CFG_ADMIN_PREFIX}
          SERVER_PORT=${CFG_SERVER_PORT}
          ICE_SERVER_PORT=${CFG_ICE_PORT}
          MONOPOLY_ADMIN_PORT=${CFG_ADMIN_PORT}
          NODE_ENV=production
          MAP_ENCRYPT_KEY=${CFG_MAP_KEY}
          EOF
          echo "--- .env ---"
          sed 's/^MAP_ENCRYPT_KEY=.*/MAP_ENCRYPT_KEY=***/' .env

      - name: 构建前端（capacitor 模式）
        run: pnpm --filter @mine-monopoly/client run build:capacitor

      - name: 校验服务器地址确实打进了产物
        env:
          CFG_DOMAIN: ${{ vars.MONOPOLY_DOMAIN || 'rich-api.yby.zone' }}
          CFG_API_PREFIX: ${{ vars.API_BASE_PREFIX || '/monopoly-server' }}
          CFG_ICE_PREFIX: ${{ vars.ICE_BASE_PREFIX || '/monopoly-ice' }}
        run: |
          set -euo pipefail
          fail=0
          for v in "$CFG_DOMAIN" "$CFG_API_PREFIX" "$CFG_ICE_PREFIX"; do
            if grep -rqF "$v" apps/client/dist/frontend/assets/; then
              echo "✅ 产物中包含 $v"
            else
              echo "::error::产物中找不到 $v"
              fail=1
            fi
          done
          exit $fail

      - name: Capacitor sync（把前端产物拷进 android 工程）
        working-directory: apps/client
        run: npx cap sync android

      - name: 还原 Android 签名密钥
        id: keystore
        env:
          # 优先用仓库 Secrets；没有就用工作流里硬编码的自建签名密钥。
          # 硬编码是为了让 fork 开箱即用 —— 代价是密钥对公开仓库可见，
          # 也就意味着任何人都能用这个密钥签一个"看起来是官方"的 APK。
          # 自己在内网装着玩可以接受；要对外分发请务必改用 Secrets。
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'minemonopoly' }}
        run: |
          set -euo pipefail
          if [ -z "$KS_B64" ]; then
            echo "::warning::没有可用的签名密钥，将退回 debug 签名（每次构建签名都不同，装新版必须先卸载）"
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KS_B64" | base64 -d > apps/client/android/ci-release.keystore
          ls -l apps/client/android/ci-release.keystore
          {
            echo "has_key=true"
            echo "pass=$KS_PASS"
            echo "alias=$KS_ALIAS"
          } >> "$GITHUB_OUTPUT"

      - name: 构建 APK
        working-directory: apps/client/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'minemonopoly' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: 整理产物
        id: apk
        env:
          CFG_DOMAIN: ${{ vars.MONOPOLY_DOMAIN || 'rich-api.yby.zone' }}
          CFG_PROTOCOL: ${{ vars.PROTOCOL || 'https' }}
          CFG_API_PREFIX: ${{ vars.API_BASE_PREFIX || '/monopoly-server' }}
          CFG_ICE_PREFIX: ${{ vars.ICE_BASE_PREFIX || '/monopoly-ice' }}
          CFG_SERVER_PORT: ${{ vars.SERVER_PORT || '8081' }}
          CFG_ICE_PORT: ${{ vars.ICE_SERVER_PORT || '8082' }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/client/package.json').version")
          SRC=$(find apps/client/android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::没找到 APK 产物"
            exit 1
          fi
          mkdir -p dist-android
          OUT="dist-android/MineMonopoly-Android-${VERSION}.apk"
          cp "$SRC" "$OUT"

          # 检查签名：确认用的是我们自己的 keystore，而不是 debug 签名
          SIGNER="未知"
          if command -v apksigner >/dev/null 2>&1; then
            SIGNER=$(apksigner verify --print-certs "$OUT" 2>/dev/null | grep -m1 "Signer #1 certificate DN" | sed 's/.*DN: //' || true)
            SIGNER="${SIGNER:-未知}"
          elif [ -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            SIGNER=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$OUT" 2>/dev/null | grep -m1 "Signer #1 certificate DN" | sed 's/.*DN: //' || true)
            SIGNER="${SIGNER:-未知}"
          fi
          echo "签名证书: $SIGNER"
          case "$SIGNER" in
            *MineMonopoly*) echo "✅ 使用自建签名密钥" ;;
            *"Android Debug"*) echo "::warning::用的是 debug 签名，下次装新版必须先卸载" ;;
          esac

          # 客户端拼地址的逻辑：有前缀 → 不带端口；无前缀 → 带端口
          if [ -n "$CFG_API_PREFIX" ]; then
            API_URL="${CFG_PROTOCOL}://${CFG_DOMAIN}${CFG_API_PREFIX}"
          else
            API_URL="${CFG_PROTOCOL}://${CFG_DOMAIN}:${CFG_SERVER_PORT}"
          fi
          if [ -n "$CFG_ICE_PREFIX" ]; then
            ICE_URL="${CFG_PROTOCOL}://${CFG_DOMAIN}${CFG_ICE_PREFIX}"
          else
            ICE_URL="${CFG_PROTOCOL}://${CFG_DOMAIN}:${CFG_ICE_PORT}"
          fi

          # 从产物里读回真实写死的值，作为最终事实依据
          BUNDLE=$(find apps/client/dist/frontend/assets -maxdepth 1 -name 'index-*.js' -printf '%s %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
          BAKED_DOMAIN=$(grep -oE 'MONOPOLY_DOMAIN:"[^"]*"' "$BUNDLE" | head -1 | cut -d'"' -f2)
          BAKED_PREFIX=$(grep -oE 'API_BASE_PREFIX:"[^"]*"' "$BUNDLE" | head -1 | cut -d'"' -f2)

          {
            echo "### Android APK 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`${VERSION}\` |"
            echo "| 大小 | \`$(du -h "$OUT" | cut -f1)\` |"
            echo "| API | \`${API_URL}\` |"
            echo "| 信令 | \`${ICE_URL}\` |"
            echo "| 产物内实际域名 | \`${BAKED_DOMAIN:-未读到}\` |"
            echo "| 产物内实际前缀 | \`${BAKED_PREFIX:-（空，端口模式）}\` |"
            echo "| 签名 | \`${SIGNER}\` |"
            echo "| 文件 | \`$(basename "$OUT")\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineMonopoly-Android-APK
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 30
